---
# How long to wait in seconds before relooping Soulseekarr and recaching Lidarr wanted lists.
# If slskd.monitor_downloads is True: reloops after all downloads (and fallbacks) have completed.
# If slskd.monitor_downloads is False: reloops immediately after all downloads are queued.
# Can be 0, but a small safety buffer is recommended in the event of small or non-existent wanted lists.
interval: 30

lidarr:
  # Get from Lidarr: Settings > General > Security
  api_key: yourlidarrapikey
  # URL Lidarr uses (e.g., what you use in your browser)
  host_url: http://lidarr:8686
  # URL path to append to host_url (ex. http://lidarr:8686/lidarr = /lidarr)
  url_base: /
  # Path to slskd downloads inside the Lidarr container
  download_dir: /data/slskd_downloads
  # Max seconds to wait for Lidarr to finish importing a completed download
  import_timeout: 3600

  # Specifies which and the order of Lidarr wanted lists to process (e.g. [`missing`, `cutoff_unmet`]).
  sources: 
    - missing
    - cutoff_unmet

  # Chunk selection modes: incrementing, shuffle, shuffle_all
  # incrementing: splits the wanted list(s) into chunk_size-sized chunks and moves to the next one each run.
  # shuffle: randomizes the active list once per process and works through it in chunk_size-sized chunks each run.
  # shuffle_all: randomizes the combined, deduplicated list from all configured sources.
  search_type: incrementing
  # Albums to process per loop. Set this higher than the wanted list to process all records per run.
  chunk_size: 20
  # Column Lidarr sorts the wanted list by. Ignored when search_type is "shuffle" or "shuffle_all".
  # Valid values: id (fastest), albums.title, albums.releaseDate, albums.lastSearchTime, artists.sortName, albumType
  sort_key: id
  # Sort direction for sort_key: ascending, descending
  sort_dir: ascending
  # Blacklist words in album or track title search (case-insensitive)
  # title_blacklist:
  #   - Word1
  #   - word2
  # Use the release manually selected in Lidarr, ignoring the other release settings below
  use_selected_lidarr_release: False
  # Pick release with most common track count
  use_most_common_tracknum: True
  # Accept multi-disc releases (e.g. treat "2xCD" as a match for "CD" in accepted_formats)
  allow_multi_disc: True
  # Accepted release countries (see https://musicbrainz.org/doc/Release/Country)
  # accepted_countries:
  #   - Europe
  #   - Japan
  #   - United Kingdom
  #   - United States
  #   - "[Worldwide]"
  #   - Australia
  #   - Canada
  # Don't check the region of the release
  # skip_region_check: True
  # If true, Lidarr won't auto-import from Slskd and Soulseekarr will skip grabbed albums
  disable_sync: False
  # Skip re-downloading albums that previously failed to import into Lidarr
  failed_import_denylist: True
  # Accepted formats to download (see https://pastebin.com/raw/pzGVUgaE)
  # accepted_formats:
  #   - CD
  #   - Digital Media
  #   - HDCD
  #   - Vinyl

slskd:
  # https://github.com/slskd/slskd/blob/master/docs/config.md#api-keys
  api_key: yourslskdapikey
  # Slskd URL
  host_url: http://slskd:5030
  # URL path to append to host_url (ex. http://slskd:5030/slskd = /slskd) 
  url_base: /
  # Download path inside Slskd container
  download_dir: /downloads
  # Wait for downloads to complete before starting the next batch
  monitor_downloads: True
  # Where failed Lidarr imports are moved to for manual review. Defaults to
  # "<download_dir>/.failed_imports" if unset.
  # failed_imports_dir: /downloads/.failed_imports

  # Search timeout in seconds
  search_timeout: 15
  # Maximum number of peers allowed in the user's queue
  maximum_peer_queue: 100
  # Minimum upload speed (bits/sec)
  minimum_peer_upload_speed: 50
  # Minimum match ratio between Lidarr track and Soulseek filename
  minimum_filename_match_ratio: 0.8
  # Delete a search after grabbing an album
  remove_searches: False
  # Max seconds to wait for stalled downloads to finish
  stalled_timeout: 7200
  # Max seconds to wait for remote queues to finish
  remote_queue_timeout: 3600
  # Remove successfully completed downloads from slskd's transfer list after each run
  # Can also be controlled on a schedule using Slskd retention.search
  remove_completed_downloads: False
  # Replace a failed album with ranked complete candidates when enabled.
  # If False, the whole album grab is marked failed as soon as one file errors, with no retry.
  requeue_failed_downloads: True
  # Prepend artist name when searching for albums
  album_prepend_artist: True
  # Filter downloaded folders down to just the allowed_filetypes and extensions_whitelist
  filtering: True
  # Also keep files with these extensions even though they don't match allowed_filetypes
  extensions_whitelist: [lrc, nfo, txt]
  # Blacklist words in search query (case-insensitive)
  search_blacklist: [WordToStripFromSearch1, WordToStripFromSearch2]
  # Rename completed downloads to "Artist - Album (Year)" before Lidarr import
  rename_download_folders: True
  # Preferred file types and qualities (most to least preferred)
  # Use "flac" or "mp3" to ignore quality details
  allowed_filetypes:
    - flac 24/48
    - flac 24/192
    - flac 16/44.1
    - flac
    - mp3 320
    - mp3
  # Users to ignore
  # ignored_users: [VeryScaryUser1, VeryUglyUser2]

# Per-list overrides (missing.lidarr, missing.slskd, cutoff_unmet.lidarr, and cutoff_unmet.slskd override the top-level `lidarr` and `slskd` defaults)
# Useful if, for example, you want to accept Vinyl releases for missing albums but only CD/Digital for cutoff-unmet upgrades.
# Overrides for "missing" list
# missing:
#   lidarr:
#     accepted_formats: [CD, Digital Media, Vinyl]
#   slskd:
#     allowed_filetypes:
#       - flac 24/96
#       - flac 24/48
#       - flac 24/192
#       - flac 16/44.1
#       - flac
#       - mp3 320
#       - mp3

# # Overrides for "cutoff_unmet" list
# cutoff_unmet:
#   lidarr:
#     accepted_formats: [CD, Digital Media]
#   slskd:
#     allowed_filetypes:
#       - flac 24/192
#       - flac 16/44.1
#       - flac

logging:
  # Passed to Python's logging.basicConfig()
  # See: https://docs.python.org/3/library/logging.html
  level: INFO
  format: "[%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s"
  datefmt: "%Y-%m-%dT%H:%M:%S%z"
  # Enable logging to a file in addition to stdout
  log_to_file: False
  # Log filename (resolved relative to the data directory)
  log_file: soulseekarr.log
  # Maximum log file size in bytes before rotation (default: 1MB)
  max_bytes: 1048576
  # Number of rotated log files to keep
  backup_count: 3
